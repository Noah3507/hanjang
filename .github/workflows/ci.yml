name: Service foundation CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main, 'feat/**', 'fix/**', 'refactor/**', 'test/**', 'docs/**', 'chore/**']

permissions:
  contents: read

jobs:
  presentation-release:
    runs-on: ubuntu-latest
    env:
      HANJANG_PRESENTATION_PASSWORD: synthetic-ci-presentation-password
      HANJANG_COPY_PROVIDER: mock
      HANJANG_COPY_ALLOW_PAID: 'false'
      HANJANG_RANKING_MODE: mock
      HANJANG_RELEASE_REQUIRE_MODELS: 'false'
      HANJANG_PHOTO_MODEL_PATH: artifacts/absent-photo.onnx
      HANJANG_ANALYSIS_MODEL_PATH: artifacts/absent-clip.pt
      HANJANG_UPLOAD_ROOT: artifacts/ci-presentation/uploads
      PLAYWRIGHT_EXTERNAL_SERVER: '1'
      PLAYWRIGHT_FRONTEND_PORT: '8014'
      PLAYWRIGHT_RELEASE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pip check
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - run: npm --prefix frontend run build
      - name: Validate safe presentation configuration and built frontend flow
        run: |
          python scripts/service_openai_smoke.py
          python scripts/service_serve.py --check-only
          mkdir -p artifacts/ci-presentation
          python scripts/service_serve.py --port 8014 > artifacts/ci-presentation/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if python scripts/service_deploy_smoke.py; then break; fi
            sleep 1
          done
          python scripts/service_deploy_smoke.py
          cd frontend
          npx playwright test release.spec.ts --reporter=list --output=../artifacts/ci-presentation/browser
      - name: Retain synthetic presentation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: presentation-failure-diagnostics
          path: artifacts/ci-presentation/
          retention-days: 7

  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check indexed files and PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python scripts/service_check_repository.py --pr-title "$PR_TITLE"
          else
            python scripts/service_check_repository.py
          fi

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pip check
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build

  browser-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r ../backend/requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify real renderer boundary cases
        working-directory: .
        env:
          RUN_RENDER_TESTS: '1'
        run: |
          python -c "from pathlib import Path; Path('artifacts/renderer').mkdir(parents=True, exist_ok=True)"
          python -m pytest tests/service/test_rendering.py tests/service/test_editor.py tests/service/test_diagnostics.py -q --basetemp artifacts/renderer/ci
      - run: npm run test:e2e
      - name: Retain synthetic upload screenshots for review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: upload-ui-screenshots
          path: |
            artifacts/playwright/results/**/upload-*.png
            artifacts/playwright/results/**/photo-processing.png
            artifacts/playwright/results/**/render-*.png
            artifacts/playwright/results/**/results-*.png
            artifacts/playwright/results/**/editor-*.png
            artifacts/playwright/results/**/diagnostics-*.png
            artifacts/playwright/results/**/ranking-model-*.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics
          path: artifacts/playwright/
          retention-days: 7
